<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- Both grounds, so the phone's own chrome matches the page rather than
     sitting a shade off it in whichever theme the reader is in. -->
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1b1f" media="(prefers-color-scheme: dark)">
<title>Vayudoot — pollution complaint agent</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🜁</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<!-- Several files rather than one, and several <link>s rather than @import,
     which would serialise the requests. -->
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/shell.css">
<link rel="stylesheet" href="/styles/sidebar.css">
<link rel="stylesheet" href="/styles/forms.css">
<link rel="stylesheet" href="/styles/maps.css">
<link rel="stylesheet" href="/styles/case.css">
<link rel="stylesheet" href="/styles/coverage.css">
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
