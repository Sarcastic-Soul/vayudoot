[project]
name = "vayudoot"
version = "0.1.0"
description = "An agent that takes a citizen pollution report from photo to filed, tracked, escalated complaint."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "strands-agents[gemini,anthropic,otel]>=1.54.0",
    "strands-agents-tools>=0.2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vayudoot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection is expressed through call-valued argument
# defaults; B008 is a false positive for this framework.
"src/vayudoot/api.py" = ["B008"]
